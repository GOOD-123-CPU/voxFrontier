[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Single source of truth for the version lives in src/voxfrontier/_version.py
# and is surfaced to setuptools via the dynamic mechanism below.
name = "voxfrontier"
dynamic = ["version"]
description = "VoxFrontier: causal and efficiency frontier analytics for voice-driven livestream performance - DEA, Shapley attribution, threshold regimes, DML and counterfactual simulation on privacy-safe synthetic data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "VoxFrontier contributors" }]
keywords = [
    "DEA", "data envelopment analysis", "Tobit", "Shapley", "SHAP",
    "threshold regression", "counterfactual simulation", "livestream e-commerce",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23,<3",
    "pandas>=1.5,<3",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional exact MILP backend for DEA (default backend is scipy.optimize.linprog / HiGHS,
# which is already a dependency). Install with: pip install .[pulp]
pulp = ["pulp>=2.7"]
# Optional SHAP explainability plots (the pipeline runs without it)
shap = ["shap>=0.42 ; python_version < '3.13'"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.5",
]

[project.scripts]
voxfrontier = "voxfrontier.cli:main"
vxf = "voxfrontier.cli:main"

[project.urls]
Homepage = "https://github.com/GOOD-123-CPU/voxFrontier"
Documentation = "https://github.com/GOOD-123-CPU/voxFrontier/tree/main/docs"
Changelog = "https://github.com/GOOD-123-CPU/voxFrontier/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/GOOD-123-CPU/voxFrontier/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxfrontier = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "voxfrontier._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # third-party numerical noise from scipy/sklearn internals; behaviour is tested
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["voxfrontier"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError",
]

[tool.ruff]
line-length = 95
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter; long formula comments kept
    "B905", # zip() strict= not available on 3.9
    "SIM108", # ternary sometimes less readable in scientific code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
