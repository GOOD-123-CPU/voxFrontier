# ---------------------------------------------------------------------------
# Central configuration for the VoxFrontier pipeline.
# All paths are relative to the repository root (resolved by the CLI).
# ---------------------------------------------------------------------------

seed: 42                 # global random seed (numpy / random / sklearn)

paths:
  data_dir: data/synthetic       # synthetic data produced by `voxfrontier synth`
  output_dir: output             # tables written by the pipeline
  figure_dir: figures            # plots written by the pipeline

data:
  n_units: 207             # number of synthetic livestream sessions (DMUs)
  product_types: ["apparel", "food", "daily_goods"]
  price_levels: ["low", "mid", "high"]
  genders: [0, 1]          # 0 / 1 anonymized binary attribute

dea:
  models: ["A", "B", "C"]  # A: no-voice, B: voice-augmented, C: full
  orientation: "input"     # input-oriented BCC / CCR
  backend: "auto"          # auto | scipy | pulp  (auto = scipy/HiGHS, fallback pulp)

attribution:
  shapley_max_vars: 10     # exact Shapley over subsets (2^k grows fast)
  n_permutations: 200      # permutation approximation if > shapley_max_vars
  rf_trees: 300
  use_shap: true           # SHAP plots if the optional package is installed

nonlinear:
  voice_vars: ["mean_f0", "range_f0", "sd_f0", "hnr", "jitter", "shimmer", "speech_rate"]
  quantiles: [0.25, 0.5, 0.75]

simulation:
  scenarios: ["baseline", "voice_to_efficient", "voice_to_valley",
              "voice_plus10", "full_optimal", "conservative"]

plot:
  dpi: 150
  language: "en"           # "en" keeps figures portable across OSes
