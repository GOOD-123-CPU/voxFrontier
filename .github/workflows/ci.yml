name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check src tests

  privacy-audit:
    name: Privacy audit (local-only scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so committed blobs are scanned too
      - name: Scan working tree for personal data patterns
        run: |
          # The pattern is split across string concatenation so this scanner
          # never matches its own rule definition (self-match guard).
          PAT=$(printf '%s%s%s%s%s%s%s' 'C:\\Us' 'ers\\|C:/Us' 'ers/' '|/Us' 'ers/' '|D:/stat' 'istical')
          ! grep -rInE "$PAT" \
            --include="*.py" --include="*.md" --include="*.yaml" \
            --include="*.yml" --include="*.toml" --include="*.cff" \
            src tests config docs examples README.md CITATION.cff
      - name: Scan git history for personal data patterns
        run: |
          # grep every committed blob; fail if any pattern matches.
          # Same self-match guard as above (pattern assembled at runtime).
          PAT=$(printf '%s%s%s%s%s%s%s' 'C:\\Us' 'ers\\|C:/Us' 'ers/' '|/Us' 'ers/' '|D:/stat' 'istical')
          FAIL=0
          while read -r oid path; do
            if git cat-file blob "$oid" 2>/dev/null \
               | grep -qE "$PAT"; then
              echo "LEAK in $path"; FAIL=1
            fi
          done < <(git rev-list --objects --all \
            | git cat-file --batch-check='%(objectname) %(objecttype) %(rest)' \
            | awk '$2=="blob" && $3 ~ /\.(py|md|ya?ml|toml|cff|csv|json)$/ {print $1" "$3}')
          if [ "$FAIL" -eq 1 ]; then
            echo "personal data pattern found in git history"; exit 1
          fi
          echo "git history clean"
      - name: Scan for real-data Excel artefacts
        run: |
          # the repo must never contain binary data files with real records
          if git ls-files | grep -iE "\.(xlsx|xls|xlsb)$"; then
            echo "unexpected Excel file tracked in git"; exit 1
          fi
          echo "no tracked Excel files"

  test:
    name: Test (py${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.12"]
        include:
          # smoke the two non-Linux platforms on a single version each
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests (with coverage)
        run: |
          pytest --cov=voxfrontier --cov-report=term --cov-report=xml
      - name: End-to-end smoke pipeline (synthetic data)
        run: |
          vxf run-all
      - name: Verify manifest integrity
        run: |
          python -c "from voxfrontier.utils.manifest import verify_manifest; r = verify_manifest('output'); assert all(r.values()), r; print('manifest OK:', r)"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxFrontier-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output/
            figures/
            coverage.xml
          retention-days: 7

  codeql:
    name: CodeQL (security scan)
    needs: [lint]
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
